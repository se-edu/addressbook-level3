name: MarkBind Action

on:
  push:
    branches:
      - master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install Graphviz
        run: sudo apt-get install graphviz
      - name: Install Java
        uses: actions/setup-java@v3
        with:
          java-version: '25'
          distribution: 'zulu'
      - name: Build & Deploy MarkBind site
        uses: MarkBind/markbind-action@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          rootDirectory: './docs'
          baseUrl: '/ab3-markbind' # replace with your repo name
          version: '^7.2.1'
